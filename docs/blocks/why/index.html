<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why</title>
<link rel="stylesheet" href="../_shared/theme.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--body); }
  body { background: var(--page-bg); }
  button { font: inherit; color: inherit; }

  .hud { position: fixed; pointer-events: none; z-index: 2; top: 28px; left: 32px; right: 32px; }
  .back { display: inline-block; margin: 0 0 12px; padding: 8px 14px; border: 1px solid var(--neon); border-radius: 999px; color: var(--ink); font-size: 14px; text-decoration: none; pointer-events: auto;
    transition: box-shadow .2s, background .2s, color .2s; }
  .back:hover, .back:focus-visible { box-shadow: 0 0 14px color-mix(in srgb, var(--neon) 45%, transparent); outline: none; }
  .back:active { background: var(--neon); color: var(--on-neon); }
  .kicker { font: 700 14px var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--neon); }
  h1 { margin: 6px 0 0; font: 700 clamp(28px, 4vw, 52px)/1.1 var(--head); letter-spacing: -.01em; }

  #stage { position: fixed; left: 0; right: 0; top: var(--top, 150px); bottom: var(--bot, 130px); touch-action: pan-y; }
  .scene { position: absolute; left: 50%; top: 0; bottom: 0; width: min(1100px, calc(100% - 64px)); transform: translateX(-50%); display: flex; flex-direction: column; justify-content: center; gap: 16px;
    opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .3s ease, visibility 0s .3s; }
  .scene.on { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .3s ease, visibility 0s; }

  #cap { position: fixed; z-index: 2; left: 50%; bottom: 84px; transform: translateX(-50%); width: min(760px, calc(100vw - 32px)); text-align: center; font-size: 16px; line-height: 1.4; pointer-events: none; min-height: 22px; }
  #nav { position: fixed; z-index: 4; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; }
  #prev, #next, #onward { cursor: pointer; font: inherit; color: var(--ink); background: color-mix(in srgb, var(--bg-glow) 72%, transparent); border: 1px solid var(--neon); display: grid; place-items: center; padding: 0; }
  #prev { width: 44px; height: 44px; border-radius: 50%; } #next { width: 76px; height: 54px; border-radius: 27px; font-size: 26px; }
  #onward { height: 44px; padding: 0 16px; display: inline-flex; align-items: center; border-radius: 22px; white-space: nowrap; font-size: 14px; text-decoration: none; }
  #prev:disabled { opacity: .3; } #next[hidden], #onward[hidden] { display: none; }
  #dots { display: flex; gap: 8px; }
  #dots i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--muted); transition: background .2s, box-shadow .2s, border-color .2s; }
  #dots i.on { background: var(--neon); border-color: var(--neon); box-shadow: 0 0 8px var(--neon); }
  #prog { font: 14px var(--mono); color: var(--muted); min-width: 3.4em; }

  /* Before -> After */
  .ba { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.35fr); gap: 18px; align-items: stretch; flex: 1; max-height: 440px; min-height: 0; }
  .card { display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; border-radius: 18px; text-align: left; min-height: 0; }
  .card .tag { font: 700 14px var(--mono); letter-spacing: .16em; text-transform: uppercase; }
  .card .txt { font-size: 17px; line-height: 1.35; }
  .vis { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 0; }
  .before { border: 1.3px dashed var(--gray); background: color-mix(in srgb, var(--gray) 7%, transparent); color: var(--muted); opacity: .85; }
  .before .tag { color: var(--gray); }
  .after { position: relative; border: 1.6px solid var(--neon); background: color-mix(in srgb, var(--neon) 7%, transparent); box-shadow: 0 0 22px color-mix(in srgb, var(--neon) 20%, transparent); cursor: pointer; color: var(--ink); -webkit-tap-highlight-color: transparent; }
  .after .tag { color: var(--neon); display: flex; justify-content: space-between; gap: 8px; } .after .tag i { font: normal 14px var(--mono); letter-spacing: 0; color: var(--muted); text-transform: none; }
  .after .txt { font-size: 20px; font-weight: 700; }
  .after:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .after.flash { animation: flash .8s ease; }
  @keyframes flash { 0% { box-shadow: 0 0 0 color-mix(in srgb, var(--neon) 0%, transparent); background: color-mix(in srgb, var(--neon) 7%, transparent); } 30% { box-shadow: 0 0 46px var(--neon); background: color-mix(in srgb, var(--neon) 24%, transparent); } 100% { box-shadow: 0 0 22px color-mix(in srgb, var(--neon) 20%, transparent); background: color-mix(in srgb, var(--neon) 7%, transparent); } }
  .arrow { align-self: center; font: 700 34px var(--mono); color: var(--neon); }
  .res { min-height: 40px; text-align: center; font: 700 clamp(18px, 2.2vw, 28px)/1.3 var(--mono); color: var(--neon); opacity: 0; transform: translateY(8px); transition: opacity .4s, transform .4s; }
  .res.on { opacity: 1; transform: none; }

  /* scene 2: a desktop with ten windows */
  .desk { position: relative; margin-top: 12px; width: 100%; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(2, 1fr); gap: 6px; padding: 8px; height: clamp(110px, 24vh, 200px); border-radius: 12px; border: 1.2px solid var(--dim); background: color-mix(in srgb, var(--bg-glow) 60%, transparent); }
  .tile { white-space: nowrap; display: grid; place-items: center; border-radius: 8px; border: 1.1px solid var(--gray); background: var(--bg); font: 14px var(--body); color: var(--muted); min-width: 0; overflow: hidden; transition: opacity .35s, transform .35s; transition-delay: var(--d, 0s); }
  .tile.keep { border-color: var(--link); color: var(--ink); font-weight: 700; }
  .after .tile.closed:not(.keep) { opacity: 0; transform: scale(.85); }
  .badge { position: absolute; right: 8px; top: -14px; padding: 3px 12px; border-radius: 999px; border: 1px solid var(--gray); background: var(--bg); font: 700 14px var(--mono); color: var(--ink); display: flex; gap: 6px; align-items: center; }
  .badge svg { width: 14px; height: 14px; fill: currentColor; }
  .after .badge { border-color: var(--neon); color: var(--neon); }
  .say { display: flex; align-items: center; gap: 14px; }
  .say b { font: 700 clamp(22px, 2.6vw, 32px) var(--mono); color: var(--neon); }
  .wave { display: flex; align-items: center; gap: 3px; height: 36px; }
  .wave i { width: 4px; height: 8px; border-radius: 2px; background: var(--link); }
  .talk .wave i { animation: bar .5s ease-in-out infinite alternate; animation-delay: calc(var(--k) * 45ms); }
  @keyframes bar { from { height: 6px; } to { height: 34px; background: var(--neon); } }
  .instant, .instant * { transition: none !important; }

  /* scene 2: typed text */
  .typed { margin: 0 auto; width: min(60ch, 100%); text-align: left; font: clamp(22px, 2.4vw, 30px)/1.5 var(--mono); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .typed p { margin: 0 0 .9em; white-space: pre-wrap; overflow-wrap: anywhere; }
  .typed .c { visibility: hidden; } .typed .c.v { visibility: visible; }
  .cur { display: inline-block; width: .6ch; height: 1.1em; margin-left: 1px; vertical-align: text-bottom; background: var(--neon); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  @media (max-width: 699px) {
    .hud { left: 16px; right: 16px; top: 18px; }
    .scene { width: calc(100% - 32px); gap: 8px; }
    #cap { font-size: 14px; bottom: 76px; }
    h1 { font-size: 28px; }
    .ba { grid-template-columns: 1fr; gap: 4px; max-height: none; }
    .arrow { transform: rotate(90deg); font-size: 24px; line-height: 1; justify-self: center; }
    .card { padding: 10px 14px; gap: 6px; } .card .txt { font-size: 15px; } .after .txt { font-size: 16px; }
    .desk { height: 84px; padding: 6px; gap: 4px; }
    .say b { font-size: 20px; } .wave { height: 24px; }
    .res { min-height: 30px; font-size: 16px; }
    .typed { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } .cur { display: none; } }
</style>
</head>
<body>

<div class="hud" id="hud">
  <a class="back" href="../index.html">← all blocks</a>
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
</div>

<main id="stage" aria-label="Why: what the project gives me">
  <section class="scene" id="s1"></section>
  <section class="scene" id="s2"></section>
</main>

<div id="cap" aria-live="polite"></div>
<nav id="nav" aria-label="Scenes">
  <button id="prev" type="button" aria-label="Previous scene">←</button>
  <div id="dots" aria-hidden="true"><i></i><i></i></div>
  <span id="prog" aria-hidden="true"></span>
  <button id="next" type="button" aria-label="Next scene">→</button>
  <a id="onward" href="../index.html" hidden>Main screen →</a>
</nav>

<script>
(() => {
'use strict';
const SCENES = [
  { kicker: 'Why · 01', title: 'I will use it.', cap: 'One word closes the distractions. I say it before I study.',
    before: 'Ten windows and a pile of notifications.', after: 'Say “focus”: only VS Code and Safari stay.', result: 'One spoken word and the screen is ready to work.' },
  { kicker: 'Why · 02', title: 'Practice.', cap: '' },
];
const LINES = ['I built this model to get hands-on practice with machine learning.', 'The animations on this site make the details of the project easier to understand.'];
const CHAR_MS = 35, LINE_PAUSE_MS = 400;
/* The desktop: ten windows, two stay. (If what/assets/focus gets real window images, replace the placeholder tiles here.) */
const FOCUS_WINDOWS = [
  { name: 'Mail' }, { name: 'Chrome' }, { name: 'VS Code', keep: true }, { name: 'Music' }, { name: 'Notes' },
  { name: 'Slack' }, { name: 'Photos' }, { name: 'Safari', keep: true }, { name: 'Teams' }, { name: 'Chat' },
];
const NOTIFICATIONS = 27;

const $ = id => document.getElementById(id);
const stage = $('stage'), hud = $('hud'), cap = $('cap'), prevBtn = $('prev'), nextBtn = $('next'), onward = $('onward');
const dots = [...document.querySelectorAll('#dots i')], scenes = [...document.querySelectorAll('.scene')];
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const MOON = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 10.5A6 6 0 0 1 5.5 3a6 6 0 1 0 7.5 7.5z"/></svg>';

// the Before / After skeleton: two cards, an arrow, the result line
function ba(host, S) {
  const row = el('div', 'ba'), b = el('div', 'card before'), arrow = el('div', 'arrow', '→'), a = el('button', 'card after');
  a.type = 'button'; arrow.setAttribute('aria-hidden', 'true');
  b.append(el('div', 'tag', 'Before'), el('div', 'txt', S.before)); const bv = el('div', 'vis'); b.appendChild(bv);
  const tag = el('div', 'tag'); tag.append('After'); tag.appendChild(el('i', '', 'tap')); a.append(tag, el('div', 'txt', S.after)); const av = el('div', 'vis'); a.appendChild(av);
  row.append(b, arrow, a); const res = el('div', 'res', S.result); host.append(row, res);
  return { a, bv, av, res };
}
const fire = (a, res, extra) => { a.classList.remove('flash'); void a.offsetWidth; a.classList.add('flash'); res.classList.add('on'); if (extra) extra(); };

const reset = [];   // per scene: back to the start state
// scene 1
let sayEl, talkTimer = 0;
(function () {
  const S = SCENES[0], x = ba($('s1'), S);
  const desk = (after) => {
    const d = el('div', 'desk'); FOCUS_WINDOWS.forEach((w, i) => { const t = el('div', 'tile' + (w.keep ? ' keep' : ''), w.name); t.style.setProperty('--d', (after ? i * 0.07 : 0).toFixed(2) + 's'); d.appendChild(t); });
    const b = el('div', 'badge'); if (after) b.innerHTML = MOON + 'Do Not Disturb'; else b.textContent = NOTIFICATIONS + ' new'; d.appendChild(b); return d;
  };
  x.bv.appendChild(desk(false));
  sayEl = el('div', 'say'); sayEl.appendChild(el('b', '', '“focus”')); const w = el('div', 'wave'); for (let k = 0; k < 12; k++) { const i = el('i'); i.style.setProperty('--k', k); w.appendChild(i); } sayEl.appendChild(w);
  const ad = desk(true); x.av.append(sayEl, ad);
  const replay = () => {
    clearTimeout(talkTimer); ad.classList.add('instant'); ad.querySelectorAll('.tile').forEach(t => t.classList.remove('closed')); sayEl.classList.remove('talk'); void ad.offsetWidth; ad.classList.remove('instant');
    if (reduce) { ad.querySelectorAll('.tile').forEach(t => t.classList.add('closed')); return; }
    sayEl.classList.add('talk'); talkTimer = setTimeout(() => { ad.querySelectorAll('.tile').forEach(t => t.classList.add('closed')); sayEl.classList.remove('talk'); }, 800);
  };
  x.a.addEventListener('click', () => fire(x.a, x.res, replay));
  reset[0] = () => { clearTimeout(talkTimer); sayEl.classList.remove('talk'); ad.querySelectorAll('.tile').forEach(t => t.classList.toggle('closed', reduce)); x.a.classList.remove('flash'); x.res.classList.toggle('on', reduce); };
})();
// scene 2: the typed text
const typing = (() => {
  const box = el('div', 'typed'), chars = [], cur = el('span', 'cur'); let pos = 0, timer = 0, busy = false, onChange = () => {};
  box.setAttribute('data-own-tap', ''); box.setAttribute('aria-label', LINES.join(' ')); cur.setAttribute('aria-hidden', 'true');
  const lineStart = [];
  LINES.forEach(t => { const p = el('p'); p.setAttribute('aria-hidden', 'true'); lineStart.push(chars.length); [...t].forEach(ch => { const c = el('span', 'c', ch); chars.push(c); p.appendChild(c); }); box.appendChild(p); });
  $('s2').appendChild(box);
  const show = n => { chars.forEach((c, i) => c.classList.toggle('v', i < n)); pos = n; if (n < chars.length) chars[n].before(cur); else chars[chars.length - 1].after(cur); };
  const stop = () => { clearTimeout(timer); busy = false; onChange(); };
  function step() {
    if (pos >= chars.length) { stop(); return; }
    show(pos + 1);
    timer = setTimeout(step, lineStart.includes(pos) ? CHAR_MS + LINE_PAUSE_MS : CHAR_MS);   // a pause before the next line starts
  }
  return {
    get busy() { return busy; }, set onChange(f) { onChange = f; },
    play() { clearTimeout(timer); if (reduce) { show(chars.length); busy = false; return; } busy = true; show(0); onChange(); timer = setTimeout(step, 250); },
    finish() { clearTimeout(timer); show(chars.length); stop(); },
    reset() { clearTimeout(timer); busy = false; show(reduce ? chars.length : 0); },
  };
})();
reset[1] = () => {};   // the text starts typing in setScene
$('s2').querySelector('.typed').addEventListener('click', () => typing.play());

let scene = 0;
// while the text is typing, → stays on screen and finishes it; the next tap goes on
function syncNav() { const last = scene === scenes.length; prevBtn.disabled = scene === 1; nextBtn.hidden = last && !(scene === 2 && typing.busy); onward.hidden = !last || (scene === 2 && typing.busy); }
typing.onChange = () => setTimeout(syncNav, 0);   // after the key / tap that finished it, so that it does not also go on
const advance = () => { if (scene === 2 && typing.busy) typing.finish(); else setScene(scene + 1); };
const fit = () => { stage.style.setProperty('--top', (hud.getBoundingClientRect().bottom + 8) + 'px'); stage.style.setProperty('--bot', (innerHeight - cap.getBoundingClientRect().top + 8) + 'px'); };
function setScene(n) {
  n = clamp(n, 1, scenes.length); const was = scene; if (n !== scene) reset[n - 1]();
  scene = n;
  scenes.forEach((s, i) => s.classList.toggle('on', i === n - 1));
  dots.forEach((d, i) => d.classList.toggle('on', i === n - 1));
  $('prog').textContent = `${n} / ${scenes.length}`;
  if (n === 2 && n !== was) typing.play(); else if (n !== 2) typing.reset();
  syncNav();
  const S = SCENES[n - 1]; $('kicker').textContent = S.kicker; $('title').textContent = S.title; cap.textContent = S.cap;
  fit();
}
prevBtn.addEventListener('click', () => setScene(scene - 1)); nextBtn.addEventListener('click', advance);
addEventListener('keydown', e => { if (e.key === 'ArrowRight') advance(); else if (e.key === 'ArrowLeft') setScene(scene - 1); });
addEventListener('resize', fit);
// one-finger swipe changes the scene; the click that follows a swipe is ignored
let down = null, swiped = false;
stage.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, type: e.pointerType }; swiped = false; });
stage.addEventListener('pointercancel', () => { down = null; });
stage.addEventListener('pointerup', e => {
  if (!down) return; const d = down; down = null; const dx = e.clientX - d.x, dy = e.clientY - d.y;
  if (d.type !== 'mouse' && Math.abs(dx) > 60 && Math.abs(dx) > 1.5 * Math.abs(dy)) { swiped = true; setScene(scene + (dx < 0 ? 1 : -1)); }
});
stage.addEventListener('click', e => { if (swiped) { e.stopPropagation(); e.preventDefault(); swiped = false; } }, true);
reset.forEach(f => f()); setScene(1); document.fonts && document.fonts.ready.then(fit);
window.__why = { scene: () => scene, go: setScene };
})();
</script>
<script src="../_shared/tapstep.js"></script>
</body>
</html>
